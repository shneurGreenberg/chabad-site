<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="בית חב״ד ליובאוויטש — בית חם לכל יהודי. חדשות, זמנים, תוכניות, תרומות ועוד.">
  <meta name="theme-color" content="#0B1C3A">
  <meta property="og:title" content="בית חב״ד ליובאוויטש">
  <meta property="og:description" content="בית חם לכל יהודי — חדשות, זמנים, תוכניות, תרומות ועוד.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="he_IL">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="בית חב״ד">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>בית חב״ד ליובאוויטש</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #0B1C3A;
      font-family: Heebo, sans-serif;
    }
    flutter-view, flt-glass-pane {
      height: 100%;
      width: 100%;
    }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #E8D48A;
      gap: 14px;
      letter-spacing: 0.04em;
      background: #0B1C3A;
      transition: opacity 0.22s ease;
    }
    .splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash .mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #16356F, #1E4A8C);
      border: 1px solid rgba(232, 212, 138, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .splash p { margin: 0; color: #F6F1E8; font-weight: 700; font-size: 18px; }
    .splash span { color: rgba(232, 212, 138, 0.8); font-size: 13px; }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <div class="mark">✡</div>
    <p>בית חב״ד ליובאוויטש</p>
    <span>טוען…</span>
  </div>
  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    function resetWindowScroll() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (!splash || splash.dataset.done) return;
      splash.dataset.done = '1';
      splash.classList.add('hide');
      setTimeout(function () {
        if (splash.parentNode) splash.remove();
      }, 240);
      resetWindowScroll();
    }
    window.addEventListener('hashchange', resetWindowScroll);
    window.addEventListener('popstate', resetWindowScroll);
    window.addEventListener('flutter-first-frame', hideSplash);
    setTimeout(hideSplash, 8000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
